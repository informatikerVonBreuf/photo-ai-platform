name: photo-ai-platform

x-backend-environment: &backend-environment
  PHOTO_AI_ENVIRONMENT: production
  PHOTO_AI_LOG_LEVEL: ${LOG_LEVEL:-INFO}
  PHOTO_AI_STORAGE_DIR: /data/photos
  PHOTO_AI_MODEL_REGISTRY_PATH: /config/model_registry.json
  PHOTO_AI_EXTERNAL_NETWORK_ALLOWED: "false"
  PHOTO_AI_OFFLINE_REQUIRED: "true"
  PHOTO_AI_REQUIRE_INFRASTRUCTURE: "true"
  PHOTO_AI_PERSISTENCE_ENABLED: "true"
  PHOTO_AI_QUEUE_ENABLED: "true"
  PHOTO_AI_EMBEDDING_SERVICE_ENABLED: ${EMBEDDING_SERVICE_ENABLED:-false}
  PHOTO_AI_VECTOR_SEARCH_ENABLED: ${EMBEDDING_SERVICE_ENABLED:-false}
  PHOTO_AI_VLM_ENABLED: ${VLM_ENABLED:-false}
  PHOTO_AI_POSTGRES_DSN: postgresql://photo_ai:${POSTGRES_PASSWORD:-change-me}@postgres:5432/photo_ai
  PHOTO_AI_QDRANT_URL: http://qdrant:6333
  PHOTO_AI_QDRANT_API_KEY: ${QDRANT_API_KEY:-change-me}
  PHOTO_AI_QDRANT_COLLECTION: ${QDRANT_COLLECTION:-photos_tinyclip_v1}
  PHOTO_AI_TEXT_VECTOR_SCORE_THRESHOLD: ${TEXT_VECTOR_SCORE_THRESHOLD:-0.28}
  PHOTO_AI_TEXT_VECTOR_RELATIVE_MARGIN: ${TEXT_VECTOR_RELATIVE_MARGIN:-0.06}
  PHOTO_AI_IMAGE_VECTOR_SCORE_THRESHOLD: ${IMAGE_VECTOR_SCORE_THRESHOLD:-0.40}
  PHOTO_AI_VLM_MODEL_ALIAS: ${VLM_MODEL_ALIAS:-smolvlm-500m}
  PHOTO_AI_VLM_JUDGE_BATCH_SIZE: ${VLM_JUDGE_BATCH_SIZE:-1}
  PHOTO_AI_VLM_RELEVANCE_THRESHOLD: ${VLM_RELEVANCE_THRESHOLD:-0.70}
  PHOTO_AI_VLM_TIMEOUT_SECONDS: ${VLM_TIMEOUT_SECONDS:-240}
  PHOTO_AI_VLM_COOLDOWN_SECONDS: ${VLM_COOLDOWN_SECONDS:-90}
  PHOTO_AI_REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
  PHOTO_AI_MINIO_URL: http://minio:9000
  PHOTO_AI_EMBEDDING_SERVICE_URL: http://embedding:8001
  PHOTO_AI_MODEL_SERVER_URL: http://llama:8080
  HF_HUB_OFFLINE: "1"
  HF_HUB_DISABLE_TELEMETRY: "1"
  HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
  DO_NOT_TRACK: "1"
  OLLAMA_NO_CLOUD: "1"

services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_private
      - app_edge

  api:
    build:
      context: ./backend
    environment:
      <<: *backend-environment
      PHOTO_AI_CORS_ORIGINS: '["http://127.0.0.1:${FRONTEND_PORT:-5173}","http://localhost:${FRONTEND_PORT:-5173}"]'
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - photo_storage:/data/photos
      - ./ml/model_registry.json:/config/model_registry.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_private
      - app_edge

  worker:
    build:
      context: ./backend
    profiles:
      - ml
    command: ["python", "-m", "app.worker"]
    environment:
      <<: *backend-environment
      PHOTO_AI_EMBEDDING_SERVICE_ENABLED: "true"
      PHOTO_AI_VECTOR_SEARCH_ENABLED: "true"
    volumes:
      - photo_storage:/data/photos
      - ./ml/model_registry.json:/config/model_registry.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      embedding:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_private

  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: photo_ai
      POSTGRES_USER: photo_ai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photo_ai -d photo_ai"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_private

  qdrant:
    image: qdrant/qdrant:v1.18.2
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-change-me}
      QDRANT__TELEMETRY_DISABLED: "true"
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
      - qdrant_snapshots:/qdrant/snapshots
    restart: unless-stopped
    networks:
      - app_private
      - app_edge

  redis:
    image: redis:7.4.3-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:-change-me}"
      ]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a '${REDIS_PASSWORD:-change-me}' ping | grep PONG"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_private

  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-photo_ai}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-now}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-19000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-19001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:9000/minio/health/live"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - app_private
      - app_edge

  embedding:
    build:
      context: ./ml
      dockerfile: Dockerfile.embedding
    profiles:
      - ml
    environment:
      EMBEDDING_RUNTIME: ${EMBEDDING_RUNTIME:-transformers_clip}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-wkcn/TinyCLIP-ViT-8M-16-Text-3M-YFCC15M}
      EMBEDDING_MODEL_REVISION: ${EMBEDDING_MODEL_REVISION:-a2a8c6eaa2549ad66eb7c31b85022bf58273a26c}
      EMBEDDING_MODEL_PATH: /models/embedding
      HF_HUB_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_DISABLE_IMPLICIT_TOKEN: "1"
      HF_HUB_DISABLE_PROGRESS_BARS: "1"
      TRANSFORMERS_OFFLINE: "1"
      DO_NOT_TRACK: "1"
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8001}:8001"
    volumes:
      - ${EMBEDDING_MODEL_HOST_PATH:-./models/tinyclip}:/models/embedding:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/model?load=true', timeout=180)"
        ]
      interval: 30s
      timeout: 180s
      retries: 12
      start_period: 180s
    restart: unless-stopped
    networks:
      - app_private

  llama:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp:server-b9445}
    profiles:
      - vlm
    command:
      - -m
      - /models/${VLM_MODEL_FILE:-SmolVLM-500M-Instruct-Q8_0.gguf}
      - --mmproj
      - /models/${VLM_MMPROJ_FILE:-mmproj-SmolVLM-500M-Instruct-Q8_0.gguf}
      - --alias
      - ${VLM_MODEL_ALIAS:-smolvlm-500m}
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --ctx-size
      - ${VLM_CONTEXT_SIZE:-4096}
      - --parallel
      - ${VLM_PARALLEL:-1}
      - --cache-ram
      - ${VLM_CACHE_RAM_MB:-0}
      - --image-max-tokens
      - ${VLM_IMAGE_MAX_TOKENS:-384}
      - --image-min-tokens
      - ${VLM_IMAGE_MIN_TOKENS:-384}
      - --jinja
    volumes:
      - ${VLM_MODEL_HOST_PATH:-./models/smolvlm}:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 600s
    restart: unless-stopped
    networks:
      - app_private

networks:
  app_edge:
    driver: bridge
  app_private:
    driver: bridge
    internal: true

volumes:
  minio_data:
  photo_storage:
  postgres_data:
  qdrant_data:
  qdrant_snapshots:
  redis_data:
