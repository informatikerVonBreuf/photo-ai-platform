name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Validate model registry schema
        run: python scripts/verify_model_registry.py
      - name: Run backend tests
        run: python -m pytest backend/tests
      - name: Compile Python sources
        run: python -m compileall -q backend scripts ml/experiments
      - name: Prepare Linux wheels for the container
        run: |
          python -m pip download \
            --requirement backend/requirements.txt \
            --dest backend/wheels \
            --only-binary=:all: \
            --platform manylinux_2_17_x86_64 \
            --implementation cp \
            --python-version 3.12 \
            --abi cp312
      - name: Build backend container
        run: docker build --tag photo-ai-platform-api:test backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Lint frontend
        working-directory: frontend
        run: npm run lint
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE: http://127.0.0.1:8000
          VITE_USE_MOCK: "false"
        run: npm run build
      - name: Build frontend container
        run: docker build --tag photo-ai-platform-frontend:test frontend

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config --quiet
